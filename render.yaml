services:
  - type: web
    name: 1a2b-online-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production

  - type: web
    name: 1a2b-online
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./client/dist
    envVars:
      - key: VITE_API_URL
        value: https://1a2b-online-api.onrender.com
      - key: VITE_SOCKET_URL
        value: https://1a2b-online-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
